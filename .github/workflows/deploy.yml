name: Deploy to HostGator

on:
  push:
    branches:
      - main   # change to "master" if that's your branch name

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./               # or ./dist/ if you have a build step
          server-dir: ./public_html/  # adjust if using an addon domain
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
